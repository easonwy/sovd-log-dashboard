version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: log_dashboard_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-log_dashboard}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'false'
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - log_dashboard_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Log Dashboard Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log_dashboard_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-log_dashboard}
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - log_dashboard_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      timeout: 5s
      retries: 5
      interval: 10s

volumes:
  mysql_data:
    driver: local

networks:
  log_dashboard_network:
    driver: bridge
