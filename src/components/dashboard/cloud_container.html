<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Page</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .iframe {
            width: 100%;
            border: none;
        }
        .iframe.h5 {
            height: 400px; /* 设置H5页面的高度 */
        }
        .iframe.web {
            height: 600px; /* 设置普通WEB页面的高度 */
            width: 600px;;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="iframe-container">
            <iframe class="iframe h5" src="https://vehicle-owner-ui-dev.alliance-rd.com.cn/" frameborder="0"></iframe>
        </div>
        <div class="iframe-container">
            <iframe class="iframe web" src="https://remote-diagnosis-ui-dev.alliance-rd.com.cn/" frameborder="0"></iframe>
        </div>
    </div>
</body>
</html>
